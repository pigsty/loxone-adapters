# Maps a Loxone object name (as it appears in the UDP event, with spaces and
# dots already turned into dashes) to the field name it should be posted to
# emoncms.org under. Any object not listed here is received and ignored.
#
# binary_fields lists emoncms field names that should always be sent as a
# visible 0->1 or 1->0 transition, even when the new value matches the last
# one emoncms saw (useful for mode/state fields that emoncms otherwise
# wouldn't register as "changed").
#
# Copy this file to field_mapping.yaml and edit it for your own Loxone setup.

fields:
  Heat-Pump-Output: heatpump_heat
  Heat-Pump-Power-In: heatpump_elec
  Total-Heat-Pump-Consumption: heatpump_elec_total
  Heating-Pump: heatpump_heating_mode

  Heat-pump-air-in: heatpump_ambient
  Downstairs-Temp: heatpump_room

  # Absorbed from the old mbus-to-emoncms / loxone-to-emoncms polling scripts
  I7: heatpump_dhw
  Heating-flow-target: heatpump_flow_target
  VI16: heatpump_flowrate
  VI28: heatpump_flow
  VI27: heatpump_return

binary_fields:
  - heatpump_heating_mode
